# ============================================================
#  basen.uz — nginx (статика Nuxt generate, /var/www/basen.uz)
#
#  Что чинит этот конфиг:
#   1) /catalog/x  больше НЕ редиректит на /catalog/x/  → 200 сразу
#      (было: 301, из-за чего все URL из sitemap не индексировались)
#   2) /catalog/x/ → 301 на /catalog/x — одна каноническая форма URL
#   3) www.basen.uz → 301 на basen.uz
#   4) несуществующий URL → настоящий 404, а не главная страница с кодом 200
#
#  Применение: см. deploy/README.md
# ============================================================

# ---------- HTTP → HTTPS ----------
server {
    listen      80;
    listen      [::]:80;
    server_name basen.uz www.basen.uz;

    # Оставляем проход для обновления сертификата Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://basen.uz$request_uri;
    }
}

# ---------- www → без www ----------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name www.basen.uz;

    # ВАЖНО: пути к сертификатам проверьте на своём сервере
    # (certbot обычно кладёт их в /etc/letsencrypt/live/basen.uz/)
    ssl_certificate     /etc/letsencrypt/live/basen.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/basen.uz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://basen.uz$request_uri;
}

# ---------- основной сайт ----------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name basen.uz;

    root /var/www/basen.uz;

    ssl_certificate     /etc/letsencrypt/live/basen.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/basen.uz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    charset utf-8;

    # --- 1. Убираем завершающий слэш: /catalog/x/ → /catalog/x ---
    # Шаблон (.+) не совпадает с "/", поэтому главная не зацикливается.
    rewrite ^/(.+)/$ /$1 permanent;

    # --- 2. Отдаём файл напрямую, БЕЗ директивы index и БЕЗ $uri/ ---
    # Именно "$uri/" в try_files заставлял nginx делать 301 с добавлением слэша.
    # Порядок: точный файл → x.html → x/index.html → честный 404.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # --- 3. Настоящий 404 (Nuxt generate кладёт 404.html в корень) ---
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store";
    }

    # --- 4. Хешированные ассеты Nuxt — кэш навсегда ---
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Картинки
    location ~* \.(?:jpg|jpeg|png|webp|avif|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # --- 5. HTML и sitemap не кэшируем, чтобы деплой был виден сразу ---
    location ~* \.(?:html|xml|txt|json)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
