# ============================================================
#  basen.uz — nginx
#  Копия рабочего конфига с сервера: /etc/nginx/sites-available/basen.uz
#  Применён 27.07.2026. Статика Nuxt generate лежит в /var/www/basen.uz.
#
#  Что чинилось (все три пункта ломали индексацию в Google):
#   1) try_files содержал "$uri/" — nginx отвечал 301 и добавлял слэш,
#      а sitemap, canonical и hreflang записаны БЕЗ слэша. В итоге URL из
#      sitemap не индексировался (редирект), а страница со слэшем — тоже
#      (её canonical вёл на редиректящий URL).
#   2) один server-блок обслуживал basen.uz и www.basen.uz — весь сайт
#      был доступен на двух хостах.
#   3) fallback "/index.html" отдавал главную страницу с кодом 200 на любой
#      несуществующий URL (soft 404).
#
#  Если правите этот файл — правьте и на сервере, конфиг не деплоится
#  автоматически. Порядок применения см. в deploy/README.md.
# ============================================================

# --- basen.uz (основной сайт) ---
server {
    server_name basen.uz;
    root /var/www/basen.uz;

    # /catalog/x/ -> /catalog/x  (одна каноническая форма URL)
    # Шаблон (.+) не совпадает с "/", поэтому главная не зацикливается.
    rewrite ^/(.+)/$ /$1 permanent;

    location = / {
        try_files /index.html =404;
    }

    # Без "$uri/" — именно он давал лишний 301 с добавлением слэша.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Настоящий 404 вместо главной страницы с кодом 200.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML и sitemap не кэшируем, чтобы деплой был виден сразу.
    location ~* \.(html|xml|txt|json)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/basen.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/basen.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# --- www.basen.uz -> basen.uz ---
server {
    listen 443 ssl;
    server_name www.basen.uz;

    ssl_certificate /etc/letsencrypt/live/basen.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/basen.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://basen.uz$request_uri;
}

# --- http -> https, всегда без www ---
server {
    listen 80;
    server_name basen.uz www.basen.uz;
    return 301 https://basen.uz$request_uri;
}
